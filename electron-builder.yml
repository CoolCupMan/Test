# electron-builder config for the Windows build of binarycore3d3x.
#
# Deliberately its own appId/productName track, separate from the Android
# app ids in capacitor.config.ts (app.binarycore.editor3dxN) — this is the
# Windows counterpart of Android build editor3dx24, so it can install (and
# later be re-bumped) side by side with any other binarycore build on the
# same machine without colliding.
appId: app.binarycore.editor3dx24win
productName: binarycore3d3x-editor3dx24

# Packed as a plain unpacked folder, NOT an .asar archive. Nothing in this
# build strictly needs that anymore (electron/main.cjs now serves dist/
# through Electron's own asar-aware protocol.handle + net.fetch, no spawned
# child process reads files off disk on its own), but keeping this off is
# still the lower-risk, already-verified-working choice over the small
# install-size saving asar would give back.
asar: false

# This workflow publishes the built .exe itself (as a GitHub Release asset,
# via `gh release` in a separate step) — electron-builder's own built-in
# publishing must stay off, or it auto-detects the CI environment and tries
# to publish on its own, which fails with no GH_TOKEN set for this step (and
# would otherwise be a second, redundant/conflicting publish path). Passed as
# the --publish never CLI flag (see package.json / the workflow) rather than
# set here — this exact version of electron-builder fails to resolve its own
# "never" publish provider when it's set as a "publish:" key in this file.

directories:
  # NOT "dist" — that's already the Vite web build this packages AS INPUT,
  # so electron-builder's own output has to live somewhere else or it would
  # collide with it.
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  # electron/main.cjs only uses Electron's own APIs and Node built-ins now
  # (no more spawned server needing express/vite/the AI SDKs at runtime) —
  # nothing under node_modules is actually needed in the packaged app, so
  # skip electron-builder's default production-dependency bundling entirely
  # rather than ship an installer full of unused packages.
  - "!node_modules/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: binarycore3d3x (editor3dx24)
