name: Build Android APK

# GitHub-hosted Ubuntu runners ship a preinstalled Android SDK, which is the
# actual reason this build lives in CI rather than being run by an assistant
# session: sandboxed dev/agent environments generally have no Android SDK and
# can't fetch one (dl.google.com is typically blocked by egress policy), so
# this workflow is the practical way to get a real, installable APK out of
# this repo.
on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
      - "main"
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android-apk.yml"

# Needed to create/update the release in the "Publish" step below.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone), needed so the
          # version number below (git rev-list --count) reflects the real,
          # total iteration count of the app's source history rather than
          # just "1" from a shallow checkout.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          # Optional — set these as repo/environment Secrets or Variables to enable
          # real Google Sign-In and working AI/login features in the packaged app.
          # Safe to leave unset: the app just disables Google Sign-In and AI calls
          # that need a reachable server until they're configured.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          # Total commit count = the precise iteration number shown in
          # Settings (src/lib/version.ts) — the original Google AI Studio
          # source plus every update since, computed fresh every build so it
          # never needs to be bumped by hand.
          export VITE_APP_VERSION="$(git rev-list --count HEAD)"
          npx vite build

      - name: Sync Capacitor Android project
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/binarycore3d3x-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: binarycore3d3x-debug-apk
          path: out/binarycore3d3x-debug.apk
          retention-days: 30

      # Actions "artifacts" (the step above) require being logged into GitHub
      # to download and always download as a wrapping .zip — both are real
      # friction when the point is sideloading straight onto a phone. A
      # Release asset has neither problem: no login required, and it's the
      # raw .apk file itself, so a phone browser downloads something Android
      # already recognizes as installable. This publishes/updates one rolling
      # "latest debug build" release with a stable, permanent download URL —
      # https://github.com/<owner>/<repo>/releases/download/android-debug-latest/binarycore3d3x-debug.apk
      - name: Publish to rolling "latest debug build" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-debug-latest"
          NOTES="Latest debug build — commit ${GITHUB_SHA::7}, built $(date -u +'%Y-%m-%d %H:%M UTC').

          Debug-signed APK for sideloading/testing. Not for distribution as a release build."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/binarycore3d3x-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "binarycore3d3x (latest debug build)" --notes "$NOTES"
          else
            gh release create "$TAG" out/binarycore3d3x-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "binarycore3d3x (latest debug build)" \
              --notes "$NOTES" \
              --prerelease
          fi
